<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* شاشة الأسئلة والقلب في الخلفية */
        #question-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; 
            pointer-events: none;
        }

        .content-box {
            position: relative;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #question-text {
            font-size: 2.2rem;
            margin-bottom: 30px;
            color: #ffb6c1;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
        }

        .buttons-container {
            display: flex;
            gap: 30px;
        }

        .btn {
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s ease;
            z-index: 1000;
        }

        #yes-btn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
        }

        #yes-btn:hover {
            transform: scale(1.1);
            background-color: #ff1a40;
        }

        #no-btn {
            background-color: #333;
            color: white;
        }

        /* صفحة الصور والاغنية بلون أحمر غامق تماماً */
        #gallery-screen {
            display: none;
            height: auto;
            min-height: 100vh;
            overflow-y: visible;
            position: relative;
            z-index: 2000;
            background-color: #61050a; 
        }

        section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }

        .section-one img {
            width: 300px;
            height: 380px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 25px;
        }

        .music-player {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        audio {
            height: 40px;
            filter: invert(1);
        }

        .section-two img {
            width: 350px;
            height: 450px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        /* ترتيب الصور الثلاث بطريقة مائلة ومتداخلة */
        .images-scattered {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scatter-img {
            position: absolute;
            width: 240px;
            height: 310px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: all 0.4s ease;
            border: 6px solid #fff;
        }

        .img-left {
            left: 10%;
            transform: rotate(-12deg) translateY(20px);
            z-index: 1;
        }

        .img-center {
            z-index: 3;
            transform: rotate(4deg) scale(1.05);
        }

        .img-right {
            right: 10%;
            transform: rotate(15deg) translateY(-20px);
            z-index: 2;
        }

        .scatter-img:hover {
            z-index: 10;
            transform: scale(1.15) rotate(0deg);
        }

        .scroll-hint {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-8px);}
            60% {transform: translateY(-4px);}
        }
    </style>
</head>
<body>

    <!-- 1. شاشة الأسئلة والقلب في الخلفية -->
    <div id="question-screen">
        <canvas id="heart"></canvas>
        <div class="content-box">
            <h1 id="question-text">تحبيني؟</h1>
            <div class="buttons-container">
                <button class="btn" id="yes-btn" onclick="handleYes()">اي</button>
                <button class="btn" id="no-btn" onclick="handleNo()">لا</button>
            </div>
        </div>
    </div>

    <!-- 2. معرض الصور والأغنية -->
    <div id="gallery-screen">
        <section class="section-one">
            <img src="photo1.jpg" alt="الصورة الأولى">
            <div class="music-player">
                <!-- أضفنا خاصية autoplay لتشتغل الأغنية فوراً -->
                <audio id="bg-music" controls autoplay>
                    <source src="song.mp4" type="audio/mp4">
                    متصفحك لا يدعم مشغل الصوت
                </audio>
            </div>
            <div class="scroll-hint">👇</div>
        </section>

        <section class="section-two">
            <img src="photo2.jpg" alt="الصورة الثانية">
            <div class="scroll-hint">👇</div>
        </section>

        <section class="section-three">
            <div class="images-scattered">
                <img src="photo3.jpg" alt="الصورة الثالثة" class="scatter-img img-left">
                <img src="photo4.jpg" alt="الصورة الرابعة" class="scatter-img img-center">
                <img src="photo5.jpg" alt="الصورة الخامسة" class="scatter-img img-right">
            </div>
        </section>
    </div>

    <script>
        let step = 1;

        // تشغيل رسم القلب في الخلفية
        const canvas = document.getElementById("heart");
        const ctx = canvas.getContext("2d");

        let points = [];
        let current = 0;
        let timer;

        function startHeartBackground() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            points = [];
            current = 0;

            for (let scale = 11; scale < 17; scale++) {
                for (let i = 0; i < 120; i++) {
                    const angle = i * (Math.PI * 2) / 120;
                    const x = 16 * Math.pow(Math.sin(angle), 3) * scale;
                    const y = (
                        13 * Math.cos(angle)
                        - 5 * Math.cos(2 * angle)
                        - 2 * Math.cos(3 * angle)
                        - Math.cos(4 * angle)
                    ) * scale;
                    points.push({ x, y });
                }
            }

            const scale = Math.min(
                1,
                (canvas.width * 0.9) / 544,
                (canvas.height * 0.9) / 544
            );

            ctx.fillStyle = "#ffb6c1";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = "bold 8px Arial";

            function drawNext() {
                if (current >= points.length) return;

                const p = points[current];
                const x = canvas.width / 2 + p.x * scale;
                const y = canvas.height / 2 - p.y * scale;

                ctx.fillText("I love you", x, y);
                current++;

                timer = setTimeout(drawNext, 20);
            }

            drawNext();
        }

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            startHeartBackground();
        });

        startHeartBackground();

        function handleNo() {
            document.getElementById('no-btn').style.display = 'none';
        }

        function handleYes() {
            if (step === 1) {
                document.getElementById('question-text').innerText = "تعشقيني مو بس تحبيني؟";
                document.getElementById('no-btn').style.display = 'none';
                step = 2;
            } else if (step === 2) {
                document.getElementById('question-screen').style.display = 'none';
                document.getElementById('gallery-screen').style.display = 'block';
                document.body.style.overflow = "auto";
                
                // تشغيل الأغنية إجبارياً مع الانتقال
                const music = document.getElementById('bg-music');
                music.play().catch(error => {
                    console.log("التشغيل التلقائي يحتاج تفاعل إضافي:", error);
                });
            }
        }
    </script>

</body>
</html>
